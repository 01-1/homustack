# Example ~/.config/claude-usage/boxes.toml. Copy it, then set your own accounts, dates and limits.
# Category units are equivalent points on the reference (weight 1) account's category meter.
# Fable and non-Fable each have their own half of Claude's weekly all-models cap.
# A smaller account gets weight = its capacity / the reference account's capacity.
# Reset inventories are MAXIMUM spending scenarios; no reset is automatic.
version = 2
approved = false # nothing stops until you set this to true
linear_meter_steps = false # turn on only after the revised estimate is validated

# Passive session counters -> estimated category points. Historical fits only;
# these estimates warn, never stop. Recalibrate against your own meters.
[rate_points_per_million]
fable = 0.7692307692
non-fable = 0.1333333333
codex = 0.2222222222

[[sources]]
provider = "claude"
email = "account-a@example.com"
weight = 1
fable_banked = 0

[[sources]]
provider = "codex"
email = "account-c@example.com"
weight = 1
banked = 0

# A preparation period: its total and rate ladder are sized from active_hours,
# and one third of the snapshot capacity is reserved for the final run.
[preparation]
start = "2026-01-05T09:00:00-05:00"
end = "2026-01-07T18:00:00-05:00"
final_end = "2026-01-07T21:00:00-05:00"
active_hours = 26
rate_stops_dry_run = false
# Notify levels are fixed in code. Raising stops automatically extends them.
[preparation.stops]
"5" = 3
"15" = 2
"30" = 1.5
"60" = 1.3

# Outside runs, simultaneous rolling caps apply:
# last 1h = 3%, 3h = 6%, 9h = 12%, 24h = 25% of category capacity.

[[runs]]
name = "Measured mock"
start = "2026-01-05T16:00:00-05:00"
end = "2026-01-05T19:00:00-05:00"
approved = false
scale = 1
# One pooled box; use before the run is excluded.
[runs.allow]
fable = 20
non-fable = 10
codex = 30

[[runs]]
name = "Final run"
start = "2026-01-07T18:00:00-05:00"
end = "2026-01-07T21:00:00-05:00"
approved = false
# Snapshot 100% of remaining usable capacity at first check in the run.
# min(weekly incl banked, five-hour spendable before end), not their sum.
remaining = true
